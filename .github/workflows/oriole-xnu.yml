name: Oriole XNU diagnostic kernel

on:
  workflow_dispatch:
  push:
    branches:
      - wip/oriole-cow-root
    paths:
      - .github/workflows/oriole-xnu.yml
      - research/pixelios-kernel/xnu/patches/**

jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 120
    defaults:
      run:
        working-directory: research/pixelios-kernel
    env:
      DXB_REPO: https://github.com/blacktop/darwin-xnu-build
      DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
    steps:
      - uses: actions/checkout@v4
      - run: tools/setup-upstream.sh
      - name: Fetch pinned builder and XNU patches
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/ 2>/dev/null || cp xnu/patches/*.patch dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
      - name: Build dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build XNU 8796 DEVELOPMENT SWEET
        working-directory: research/pixelios-kernel/dxb
        env:
          MACOS_VERSION: "13.5"
          KERNEL_CONFIG: DEVELOPMENT
          MACHINE_CONFIG: SWEET
        run: bash build.sh
      - name: Collect kernel and hash
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oriole-xnu-kernel
          path: research/pixelios-kernel/out/
          if-no-files-found: warn
